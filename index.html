<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="manifest" href="manifest.json">
  <title>Tony SRE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .status {
      font-size: 12px;
      color: #55e68a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #55e68a;
      border-radius: 50%;
    }

    .hero {
      text-align: center;
      margin-top: 30px;
    }

    .hero h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .hero p {
      color: #8d8d99;
      margin: 0;
      font-size: 15px;
    }

    .talk-button {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      margin: 60px auto 35px;
      display: block;
      background: white;
      color: #0b0b0f;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 50px rgba(255,255,255,0.12);
      transition: transform 0.2s;
    }

    .talk-button:active {
      transform: scale(0.94);
    }

    .conversation {
      background: #141419;
      border: 1px solid #25252d;
      border-radius: 18px;
      padding: 18px;
      margin-top: auto;
    }

    .conversation-title {
      color: #777783;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .message {
      color: #dddde5;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #555560;
      font-size: 11px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="logo">TONY SRE</div>

      <div class="status">
        <span class="dot"></span>
        ONLINE
      </div>
    </header>

    <section class="hero">
      <h1>What's going on?</h1>
      <p>Your AI SRE is ready.</p>

    <elevenlabs-convai
<div class="tony-call">
  <div class="status">● ONLINE</div>
  <h1>TONY SRE</h1>
  <p>Your AI SRE is ready.</p>

  <elevenlabs-convai
    agent-id="agent_4501k7xa0jn2fgkrvnrtfwwst6hq"
    variant="expanded"
    action-text="TALK TO TONY"
    start-call-text="Talk to Tony"
    end-call-text="End call"
    listening-text="Listening..."
    speaking-text="Tony is speaking..."
  ></elevenlabs-convai>
</div>
></elevenlabs-convai>

<script
  src="https://unpkg.com/@elevenlabs/convai-widget-embed"
  async
  type="text/javascript"
></script>
    </section>

    <section class="conversation">
      <div class="conversation-title">
        Tony
      </div>

      <div class="message" id="message">
        Hey, I'm Tony. What's going on?
      </div>
    </section>

    <div class="footer">
      Proactive AI for engineering teams
    </div>

  </main>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
