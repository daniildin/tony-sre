<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#573DFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <title>Tony SRE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #573DFF;
      color: #FFFFFF;
      font-family: Archivo, -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    .header {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #C4FF3C;
      border-radius: 50%;
    }

    /* Main */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 70px 24px 50px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 13vw, 76px);
      line-height: 0.95;
      letter-spacing: -4px;
      font-weight: 600;
    }

    .description {
      max-width: 390px;
      margin: 24px auto 0;
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.85;
    }

    /* Tony card */

    .card {
      width: 100%;
      max-width: 430px;
      margin-top: 64px;
      background: #FFFFFF;
      color: #2B2D42;
      border-radius: 24px;
      padding: 28px;
      text-align: left;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-label {
      font-size: 11px;
      opacity: 0.5;
    }

    .message {
      border-left: 3px solid #573DFF;
      padding-left: 14px;
      margin-bottom: 28px;
    }

    .message-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      opacity: 0.45;
      margin-bottom: 7px;
    }

    .message-text {
      font-size: 17px;
      line-height: 1.4;
    }

    .agent {
      display: flex;
      justify-content: center;
      min-height: 65px;
    }

    /* Footer */

    .footer {
      padding: 20px 24px 26px;
      text-align: center;
      font-size: 11px;
      opacity: 0.65;
    }

    @media (max-width: 600px) {
      .main {
        padding-top: 55px;
      }

      h1 {
        letter-spacing: -3px;
      }

      .description {
        font-size: 15px;
      }

      .card {
        margin-top: 52px;
        border-radius: 20px;
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">

      <div class="logo">
        Tony SRE
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>

    </header>

    <main class="main">

      <div class="eyebrow">
        Autonomous on-call engineer
      </div>

      <h1>
        What's<br>
        going on?
      </h1>

      <p class="description">
        Tony SRE investigates incidents and helps resolve issues before they escalate.
      </p>

      <section class="card">

        <div class="card-top">
          <div class="card-title">
            Tony SRE
          </div>

          <div class="card-label">
            READY
          </div>
        </div>

        <div class="message">

          <div class="message-label">
            Tony
          </div>

          <div class="message-text">
            Hey, I'm Tony. What's going on?
          </div>

        </div>

        <div class="agent">

          <elevenlabs-convai
            agent-id="YOUR_AGENT_ID"
            variant="expanded"
            action-text="Talk to Tony"
            start-call-text="Talk to Tony"
            end-call-text="End call"
            listening-text="Listening..."
            speaking-text="Tony is speaking..."
          ></elevenlabs-convai>

        </div>

      </section>

    </main>

    <footer class="footer">
      Vibranium Labs
    </footer>

  </div>

  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    async
    type="text/javascript">
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
