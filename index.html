<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B2D42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <title>Tony SRE</title>

  <!-- Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #2B2D42;
      color: #FFFFFF;
      font-family: Archivo, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C4FF3C;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .eyebrow {
      color: #C4C3C8;
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -1.5px;
    }

    .description {
      color: #C4C3C8;
      font-size: 16px;
      line-height: 1.5;
      margin: 16px 0 36px;
      max-width: 340px;
    }

    .call-container {
      width: 100%;
      min-height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    footer {
      text-align: center;
      color: #C4C3C8;
      font-size: 12px;
      padding-top: 24px;
    }

    /* Keep ElevenLabs widget above the page */
    elevenlabs-convai {
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="brand">Tony SRE</div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </header>

    <main>

      <div class="eyebrow">Autonomous on-call engineer</div>

      <h1>What's going on?</h1>

      <p class="description">
        Tony SRE investigates incidents, finds the signal, and helps resolve issues before they escalate.
      </p>

      <div class="call-container">

        <elevenlabs-convai
          agent-id="agent_4501k7xa0jn2fgkrvnrtfwwst6hq"
          variant="expanded"
          action-text="Talk to Tony"
          start-call-text="Talk to Tony"
          end-call-text="End call"
          listening-text="Listening..."
          speaking-text="Tony is speaking..."
        ></elevenlabs-convai>

      </div>

    </main>

    <footer>
      Vibranium Labs
    </footer>

  </div>

  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    async
    type="text/javascript">
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
