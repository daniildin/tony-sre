<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Tony SRE</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#120028" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: Archivo, -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(87, 61, 255, 0.28) 0%,
          rgba(87, 61, 255, 0.08) 32%,
          transparent 58%
        ),
        radial-gradient(
          circle at 0% 70%,
          rgba(126, 0, 255, 0.8) 0%,
          transparent 42%
        ),
        radial-gradient(
          circle at 100% 30%,
          rgba(126, 0, 255, 0.75) 0%,
          transparent 42%
        ),
        linear-gradient(
          135deg,
          #3d008f 0%,
          #120028 40%,
          #090014 58%,
          #4b00b5 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 20%,
          rgba(0, 0, 0, 0.38) 100%
        );
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      padding:
        max(28px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(26px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));

      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-name {
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .beta {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 11px;
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.72);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c4ff3c;

      box-shadow:
        0 0 10px rgba(196, 255, 60, 0.7);
    }

    /* HERO */

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      width: min(920px, 100%);
      text-align: center;
      transform: translateY(-2vh);
    }

    .eyebrow {
      margin-bottom: 28px;

      color: rgba(196, 184, 255, 0.82);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.34em;
    }

    h1 {
      font-size: clamp(52px, 7vw, 100px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 600;

      margin-bottom: 30px;
    }

    .description {
      width: min(750px, 100%);
      margin: 0 auto 42px;

      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
    }

    /* ELEVENLABS AREA */

    .voice-area {
      width: min(390px, 100%);
      margin: 0 auto;
    }

    .voice-shell {
      background: #ffffff;
      padding: 7px;
      border-radius: 999px;

      box-shadow:
        0 12px 50px rgba(0, 0, 0, 0.28),
        0 0 45px rgba(87, 61, 255, 0.22);

      overflow: hidden;
    }

    elevenlabs-convai {
      display: block;
      width: 100%;
    }

    .helper {
      margin-top: 18px;

      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      color: rgba(255, 255, 255, 0.42);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
    }

    /* PHONE */

    @media (max-width: 600px) {
      .app {
        padding-left: 20px;
        padding-right: 20px;
      }

      .brand-name {
        font-size: 20px;
      }

      .beta {
        font-size: 9px;
        padding: 6px 9px;
      }

      .status {
        font-size: 9px;
        letter-spacing: 0.2em;
        gap: 7px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
      }

      .hero {
        transform: translateY(-1vh);
      }

      .eyebrow {
        font-size: 10px;
        line-height: 1.5;
        letter-spacing: 0.25em;
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(48px, 15vw, 68px);
        line-height: 0.96;
        margin-bottom: 24px;
      }

      .description {
        font-size: 17px;
        line-height: 1.45;
        margin-bottom: 34px;
      }

      .voice-area {
        width: 100%;
        max-width: 350px;
      }

      footer {
        text-align: center;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="brand">
        <div class="brand-name">Tony SRE</div>
        <div class="beta">BETA</div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </header>


    <main>
      <section class="hero">

        <div class="eyebrow">
          AUTONOMOUS ON-CALL ENGINEER
        </div>

        <h1>
          Always-on AI SRE
        </h1>

        <p class="description">
          Specialized agents handle investigation, coordination,
          and follow-through so engineers focus on resolving,
          not chasing.
        </p>


        <div class="voice-area">

          <div class="voice-shell">

            <elevenlabs-convai
              agent-id="YOUR_AGENT_ID"
              variant="expanded"
              action-text="Talk to Tony"
              start-call-text="Talk to Tony"
              end-call-text="End call"
              listening-text="Listening..."
              speaking-text="Tony is speaking...">
            </elevenlabs-convai>

          </div>

          <div class="helper">
            Tap to start a voice conversation
          </div>

        </div>

      </section>
    </main>


    <footer>
      BUILT BY VIBRANIUM LABS
    </footer>

  </div>


  <!-- ElevenLabs -->
  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    async
    type="text/javascript">
  </script>


  <!-- PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
