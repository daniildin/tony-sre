<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Tony SRE</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#120022" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;

      font-family:
        Archivo,
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      color: #ffffff;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 8% 60%,
          rgba(112, 0, 255, 0.95) 0%,
          rgba(91, 0, 214, 0.45) 23%,
          transparent 46%
        ),
        radial-gradient(
          circle at 92% 40%,
          rgba(116, 0, 255, 0.95) 0%,
          rgba(87, 0, 210, 0.4) 25%,
          transparent 48%
        ),
        radial-gradient(
          circle at 50% 45%,
          rgba(87, 61, 255, 0.22),
          transparent 40%
        ),
        linear-gradient(
          120deg,
          #370078 0%,
          #140024 35%,
          #090011 60%,
          #43009a 100%
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0, 0, 0, 0.32) 100%
      );
    }

    .app {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        max(28px, env(safe-area-inset-top))
        max(32px, env(safe-area-inset-right))
        max(26px, env(safe-area-inset-bottom))
        max(32px, env(safe-area-inset-left));
    }

    /* HEADER */

    header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-name {
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .beta {
      padding: 7px 12px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.12);

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;

      color: rgba(255, 255, 255, 0.72);

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
    }

    .status-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #c4ff3c;

      box-shadow:
        0 0 8px rgba(196, 255, 60, 0.8),
        0 0 18px rgba(196, 255, 60, 0.35);
    }

    /* MAIN */

    main {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      width: 100%;
    }

    .hero {
      width: min(950px, 100%);
      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateY(-2vh);
    }

    .eyebrow {
      margin-bottom: 28px;

      color: #b8a8ff;

      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.34em;
    }

    h1 {
      margin-bottom: 28px;

      font-size: clamp(54px, 7vw, 100px);
      font-weight: 600;

      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .description {
      width: min(760px, 100%);

      margin: 0 auto;

      color: rgba(255, 255, 255, 0.74);

      font-size: clamp(17px, 2vw, 23px);
      font-weight: 400;

      line-height: 1.5;
    }

    /* VOICE */

    .voice-area {
      width: 100%;

      margin-top: 36px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .widget-row {
      width: 100%;
      min-height: 80px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    elevenlabs-convai {
      display: block;

      width: auto;
      min-width: 160px;
      min-height: 70px;

      margin: 0 auto;
    }

    .helper {
      width: 100%;

      margin-top: 14px;

      text-align: center;

      color: rgba(255, 255, 255, 0.48);

      font-size: 14px;
      font-weight: 400;
    }

    /* FOOTER */

    footer {
      color: rgba(255, 255, 255, 0.4);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.28em;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .app {
        padding-left: 20px;
        padding-right: 20px;
      }

      .brand {
        gap: 8px;
      }

      .brand-name {
        font-size: 20px;
      }

      .beta {
        padding: 5px 8px;
        font-size: 8px;
      }

      .status {
        gap: 7px;

        font-size: 8px;
        letter-spacing: 0.2em;
      }

      .status-dot {
        width: 8px;
        height: 8px;
      }

      .hero {
        transform: translateY(-1vh);
      }

      .eyebrow {
        margin-bottom: 20px;

        font-size: 9px;
        letter-spacing: 0.25em;
        line-height: 1.5;
      }

      h1 {
        margin-bottom: 22px;

        font-size: clamp(48px, 14vw, 66px);

        line-height: 0.95;
      }

      .description {
        max-width: 340px;

        font-size: 16px;
        line-height: 1.5;
      }

      .voice-area {
        margin-top: 30px;
      }

      .widget-row {
        min-height: 80px;
      }

      elevenlabs-convai {
        width: auto;
        min-width: 160px;
        min-height: 70px;

        margin-left: auto;
        margin-right: auto;
      }

      .helper {
        margin-top: 12px;
        font-size: 13px;
      }

      footer {
        text-align: center;

        font-size: 8px;
        letter-spacing: 0.22em;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>

      <div class="brand">
        <div class="brand-name">Tony SRE</div>
        <div class="beta">BETA</div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>

    </header>


    <main>

      <section class="hero">

        <div class="eyebrow">
          AUTONOMOUS ON-CALL ENGINEER
        </div>

        <h1>
          Always-on AI SRE
        </h1>

        <p class="description">
          Specialized agents handle investigation, coordination,
          and follow-through so engineers focus on resolving,
          not chasing.
        </p>


        <!-- TONY VOICE -->

        <div class="voice-area">

          <div class="widget-row">

            <elevenlabs-convai
              agent-id="agent_4501k7xa0jn2fgkrvnrtfwwst6hq"
              variant="expanded"
              action-text="Talk to Tony"
              start-call-text="Talk to Tony"
              end-call-text="End call"
              listening-text="Listening..."
              speaking-text="Tony is speaking..."
            ></elevenlabs-convai>

          </div>

          <div class="helper">
            Tap to start a voice conversation
          </div>

        </div>

      </section>

    </main>


    <footer>
      BUILT BY VIBRANIUM LABS
    </footer>

  </div>


  <!-- ELEVENLABS -->

  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    type="text/javascript"
    async>
  </script>


  <!-- PWA -->

  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(function (error) {
            console.log(
              "Service worker registration failed:",
              error
            );
          });

      });

    }
  </script>

</body>
</html>
